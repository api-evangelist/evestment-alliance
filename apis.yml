description: 'eVestment Alliance is an institutional investment data, analytics, and
  market-intelligence platform founded in 2000 and headquartered in Atlanta, Georgia.
  Institutional asset managers report performance, holdings, and firm data into the
  platform, while investment consultants, asset owners, and allocators use it to research,
  screen, and compare managers, funds, and strategies across traditional and alternative
  asset classes. eVestment was acquired by Nasdaq in 2017 and is now delivered as part
  of Nasdaq''s investment-intelligence solutions; its primary website redirects to
  nasdaq.com/solutions/evestment/. Originally backed by Insight Partners, it is tracked
  in the API Evangelist network as a portfolio company. No public developer portal,
  API documentation, or machine-readable API surface is currently published.'
